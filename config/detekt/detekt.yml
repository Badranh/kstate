# Builds on detekt's default config; only deviations live here.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    # detekt's defaults plus wasmJs, so `Foo.wasmJs.kt` actuals are accepted like `Foo.jvm.kt`.
    multiplatformTargets: ['ios', 'android', 'js', 'jvm', 'native', 'iosArm64', 'iosX64', 'iosSimulatorArm64', 'macosX64', 'mingwX64', 'linuxX64', 'wasmJs']
style:
  MagicNumber:
    excludes: ['**/*Test/**', '**/test/**']
